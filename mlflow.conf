# MLflow Configuration for Diabetes Readmission Prediction Project

# MLflow Tracking Configuration
[mlflow]
# Tracking URI - can be local SQLite, PostgreSQL, or remote MLflow server
tracking_uri = "sqlite:///mlflow.db"

# Default experiment name
default_experiment_name = "diabetes-readmission-prediction"

# Model registry
model_registry_uri = "sqlite:///mlflow.db"

# Artifact storage
artifact_root = "./mlflow_artifacts"

# Logging configuration
log_level = "INFO"

# Model deployment configuration
[deployment]
# Default model stage for production
default_stage = "Production"

# Model serving configuration
[serving]
# Port for model serving
port = 5000

# Host for model serving
host = "0.0.0.0"

# Model versioning
[versioning]
# Auto-increment version numbers
auto_increment_version = true

# Keep model history
keep_model_history = true

# Maximum number of model versions to keep
max_versions = 10

# Model validation
[validation]
# Enable model validation
enable_validation = true

# Validation metrics thresholds
roc_auc_threshold = 0.6
accuracy_threshold = 0.6
precision_threshold = 0.15
recall_threshold = 0.5

# Model monitoring
[monitoring]
# Enable model monitoring
enable_monitoring = true

# Monitoring frequency (in minutes)
monitoring_frequency = 60

# Alert thresholds
performance_degradation_threshold = 0.05
data_drift_threshold = 0.1

# Model retraining
[retraining]
# Enable automatic retraining
enable_auto_retraining = false

# Retraining frequency (in days)
retraining_frequency = 30

# Retraining trigger conditions
retraining_triggers = ["performance_degradation", "data_drift", "manual"]

# Model comparison
[comparison]
# Enable model comparison
enable_comparison = true

# Comparison metrics
comparison_metrics = ["roc_auc", "accuracy", "precision", "recall", "f1_score"]

# Statistical significance threshold
significance_threshold = 0.05

# Model explainability
[explainability]
# Enable model explainability
enable_explainability = true

# SHAP configuration
shap_enabled = true
shap_max_samples = 1000

# LIME configuration
lime_enabled = true
lime_max_samples = 100

# Model security
[security]
# Enable model security
enable_security = true

# Model encryption
encrypt_models = false

# Access control
enable_access_control = false

# Audit logging
enable_audit_logging = true

# Model backup
[backup]
# Enable model backup
enable_backup = true

# Backup frequency (in days)
backup_frequency = 7

# Backup retention (in days)
backup_retention = 90

# Backup location
backup_location = "./mlflow_backups"

# Model export
[export]
# Enable model export
enable_export = true

# Export formats
export_formats = ["pickle", "onnx", "tensorflow"]

# Export location
export_location = "./mlflow_exports"

# Model performance tracking
[performance]
# Enable performance tracking
enable_performance_tracking = true

# Performance metrics
performance_metrics = ["latency", "throughput", "memory_usage", "cpu_usage"]

# Performance thresholds
latency_threshold_ms = 1000
throughput_threshold_rps = 100
memory_threshold_mb = 2048
cpu_threshold_percent = 80

# Model metadata
[metadata]
# Project information
project_name = "Diabetes Readmission Prediction"
project_version = "1.0.0"
project_description = "Machine Learning system for predicting 30-day readmission risk in diabetic patients"

# Dataset information
dataset_name = "UCI Diabetes Readmission Dataset"
dataset_version = "1.0"
dataset_description = "Hospital readmission data for diabetes patients"

# Model information
model_type = "LightGBM Classifier"
model_framework = "scikit-learn"
model_language = "Python"

# Team information
team_name = "Data Science Team"
team_contact = "team@company.com"

# Compliance information
compliance_standards = ["HIPAA", "GDPR"]
data_privacy_level = "high"
model_bias_check = true

# Model documentation
[documentation]
# Enable automatic documentation
enable_auto_documentation = true

# Documentation templates
documentation_templates = ["model_card", "api_documentation", "user_guide"]

# Documentation location
documentation_location = "./mlflow_docs"

# Model testing
[testing]
# Enable model testing
enable_testing = true

# Test data location
test_data_location = "./test_data"

# Test metrics
test_metrics = ["accuracy", "precision", "recall", "f1_score", "roc_auc"]

# Test thresholds
test_thresholds = {
    "accuracy": 0.6,
    "precision": 0.15,
    "recall": 0.5,
    "f1_score": 0.25,
    "roc_auc": 0.6
}

# Model packaging
[packaging]
# Enable model packaging
enable_packaging = true

# Package formats
package_formats = ["docker", "conda", "pip"]

# Package location
package_location = "./mlflow_packages"

# Model serving
[serving]
# Enable model serving
enable_serving = true

# Serving framework
serving_framework = "fastapi"

# Serving configuration
serving_config = {
    "host": "0.0.0.0",
    "port": 8000,
    "workers": 4,
    "timeout": 30
}

# Model scaling
[scaling]
# Enable model scaling
enable_scaling = true

# Scaling strategy
scaling_strategy = "horizontal"

# Scaling triggers
scaling_triggers = ["cpu_usage", "memory_usage", "request_rate"]

# Scaling thresholds
cpu_scaling_threshold = 70
memory_scaling_threshold = 80
request_rate_scaling_threshold = 1000

# Model optimization
[optimization]
# Enable model optimization
enable_optimization = true

# Optimization techniques
optimization_techniques = ["quantization", "pruning", "distillation"]

# Optimization targets
optimization_targets = ["latency", "memory", "accuracy"]

# Model versioning
[versioning]
# Versioning strategy
versioning_strategy = "semantic"

# Version format
version_format = "major.minor.patch"

# Version increment rules
version_increment_rules = {
    "major": ["breaking_changes", "architecture_changes"],
    "minor": ["new_features", "performance_improvements"],
    "patch": ["bug_fixes", "minor_improvements"]
}

# Model lifecycle
[lifecycle]
# Model lifecycle stages
lifecycle_stages = ["Development", "Staging", "Production", "Archived"]

# Stage transition rules
stage_transition_rules = {
    "Development": ["Staging"],
    "Staging": ["Production", "Development"],
    "Production": ["Archived", "Staging"],
    "Archived": ["Production"]
}

# Stage validation requirements
stage_validation_requirements = {
    "Staging": ["unit_tests", "integration_tests", "performance_tests"],
    "Production": ["staging_validation", "security_scan", "performance_validation"]
}

# Model governance
[governance]
# Enable model governance
enable_governance = true

# Governance policies
governance_policies = ["data_privacy", "model_fairness", "performance_monitoring"]

# Approval workflow
approval_workflow = {
    "staging_to_production": ["data_scientist", "ml_engineer", "product_manager"],
    "production_to_archived": ["data_scientist", "ml_engineer"]
}

# Model compliance
[compliance]
# Enable compliance checking
enable_compliance = true

# Compliance standards
compliance_standards = ["HIPAA", "GDPR", "SOX", "PCI-DSS"]

# Compliance checks
compliance_checks = {
    "data_privacy": ["data_encryption", "access_control", "audit_logging"],
    "model_fairness": ["bias_detection", "fairness_metrics", "demographic_parity"],
    "performance_monitoring": ["accuracy_monitoring", "drift_detection", "alerting"]
}

# Model alerts
[alerts]
# Enable alerting
enable_alerts = true

# Alert channels
alert_channels = ["email", "slack", "webhook"]

# Alert conditions
alert_conditions = {
    "performance_degradation": {
        "threshold": 0.05,
        "window": "1h",
        "severity": "high"
    },
    "data_drift": {
        "threshold": 0.1,
        "window": "24h",
        "severity": "medium"
    },
    "model_failure": {
        "threshold": 1,
        "window": "5m",
        "severity": "critical"
    }
}

# Model metrics
[metrics]
# Custom metrics
custom_metrics = ["business_value", "clinical_impact", "cost_savings"]

# Metric calculation
metric_calculation = {
    "business_value": "annual_cost_savings * roi_percentage",
    "clinical_impact": "readmissions_prevented * quality_score",
    "cost_savings": "readmissions_prevented * avg_readmission_cost"
}

# Metric thresholds
metric_thresholds = {
    "business_value": 1000000,
    "clinical_impact": 100,
    "cost_savings": 500000
}

# Model reporting
[reporting]
# Enable reporting
enable_reporting = true

# Report types
report_types = ["performance_report", "business_report", "compliance_report"]

# Report frequency
report_frequency = {
    "performance_report": "daily",
    "business_report": "weekly",
    "compliance_report": "monthly"
}

# Report recipients
report_recipients = {
    "performance_report": ["data_science_team", "ml_engineering_team"],
    "business_report": ["product_team", "executive_team"],
    "compliance_report": ["compliance_team", "legal_team"]
}

# Model integration
[integration]
# Enable integration
enable_integration = true

# Integration points
integration_points = ["api_gateway", "data_pipeline", "monitoring_system"]

# Integration configuration
integration_config = {
    "api_gateway": {
        "endpoint": "/predict",
        "authentication": "bearer_token",
        "rate_limiting": "1000/hour"
    },
    "data_pipeline": {
        "input_format": "json",
        "output_format": "json",
        "batch_size": 100
    },
    "monitoring_system": {
        "metrics_endpoint": "/metrics",
        "health_endpoint": "/health",
        "logging_level": "info"
    }
}
